update_component_config:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: openems
          multiple: true
    properties:
      required: true
      example: '{"enabledCharging": true, "chargeMode": "force_charge"}'
      selector:
        object:

rest_write_sensor:
  target:
    entity:
      integration: openems
      domain: sensor
  fields:
    value:
      required: true
      selector:
        number:
    timeout:
      required: true
      default: 0
      selector:
        number:
          unit_of_measurement: seconds
    update_cycle:
      required: true
      default: 30
      selector:
        number:
          unit_of_measurement: seconds

rest_write_binary_sensor:
  target:
    entity:
      integration: openems
      domain: binary_sensor
  fields:
    value:
      required: true
      selector:
        number:
    timeout:
      required: true
      default: 0
      selector:
        number:
          unit_of_measurement: seconds
    update_cycle:
      required: true
      default: 30
      selector:
        number:
          unit_of_measurement: seconds
