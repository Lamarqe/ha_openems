update_component_config:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: openems
          multiple: true
    properties:
      required: true
      example: '{"enabledCharging": true, "chargeMode": "force_charge"}'
      selector:
        object:

write_channel:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: openems
    channel:
      required: true
      example: SetActivePowerEquals
      selector:
        text:
    value:
      required: true
      example: "-2000"
      selector:
        text:
    update_cycle:
      default: 0
      selector:
        number:
          min: 0
          max: 3600
          mode: box
          unit_of_measurement: seconds
    timeout:
      default: 0
      selector:
        number:
          min: 0
          max: 86400
          mode: box
          unit_of_measurement: seconds
