rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: |
      Channel data is pushed by the edge. Only the update entity polls, every
      12 hours.
  brands:
    status: todo
    comment: |
      The brands repository has the images in custom_integrations/openems only, core
      integrations need them in core_integrations/openems.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: todo
    comment: Documentation pull request for home-assistant.io.
  docs-high-level-description:
    status: todo
    comment: Documentation pull request for home-assistant.io.
  docs-installation-instructions:
    status: todo
    comment: Documentation pull request for home-assistant.io.
  docs-removal-instructions:
    status: todo
    comment: Documentation pull request for home-assistant.io.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: todo
    comment: Documentation pull request for home-assistant.io.
  docs-installation-parameters:
    status: todo
    comment: Documentation pull request for home-assistant.io.
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      The client library logs the connection loss and the reconnect once each,
      at info level.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: todo
    comment: Depends on discovery.
  discovery:
    status: todo
    comment: |
      No discovery yet. Candidate: DHCP discovery by the hostname of FEMS
      (fems<number>).
  docs-data-update:
    status: todo
    comment: Documentation pull request for home-assistant.io.
  docs-examples:
    status: todo
    comment: Documentation pull request for home-assistant.io.
  docs-known-limitations:
    status: todo
    comment: Documentation pull request for home-assistant.io.
  docs-supported-devices:
    status: todo
    comment: Documentation pull request for home-assistant.io.
  docs-supported-functions:
    status: todo
    comment: Documentation pull request for home-assistant.io.
  docs-troubleshooting:
    status: todo
    comment: Documentation pull request for home-assistant.io.
  docs-use-cases:
    status: todo
    comment: Documentation pull request for home-assistant.io.
  dynamic-devices:
    status: todo
    comment: New components only appear after a reload, see the edgeConfig listener.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations:
    status: todo
    comment: |
      Primary channels have translated names. Non-primary channels get readable
      English names generated by the client library from the channel ID.
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: |
      There are no issues the user has to act on, a rejected login starts the
      reauthentication flow.
  stale-devices:
    status: todo
    comment: |
      Devices of removed components can be removed manually only, see the
      edgeConfig listener.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: todo
    comment: The client library is typed and checked with mypy strict, the integration is not checked yet.
